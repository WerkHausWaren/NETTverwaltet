{# Stil + Anmelde-Knopf-Skript der Termin-Zeile (_termin_zeile.html) – genutzt auf Startseite und Terminseite #}
<style>
    a.tz { display: grid; grid-template-columns: 92px minmax(0, 1fr) 34px; grid-template-rows: auto auto 1fr;
           column-gap: 11px; text-decoration: none; color: inherit; border-left: 4px solid var(--tf);
           background: color-mix(in srgb, var(--tf) 10%, var(--flaeche)); border-bottom: 2px solid var(--flaeche); }
    a.tz:last-child { border-bottom: 0; }
    .tz-bild { grid-column: 1; grid-row: 1 / 4; display: block; width: 100%; height: 100%; min-height: 76px; object-fit: cover; }
    .tz-platz { background: color-mix(in srgb, var(--tf) 10%, #ffffff) center / 92% no-repeat; background-blend-mode: multiply;
                {% if design and design.logo_dateiname %}background-image: url("{{ url_for('portal.logo') }}");{% endif %} }
    :root[data-modus="dunkel"] .tz-platz { background-color: color-mix(in srgb, var(--tf) 28%, #b9c2d0); }
    @media (prefers-color-scheme: dark) { :root[data-modus="auto"] .tz-platz { background-color: color-mix(in srgb, var(--tf) 28%, #b9c2d0); } }
    .tz-text { grid-column: 2; grid-row: 1 / 4; padding: 10px 0; min-width: 0; }
    .tz-titel { font-weight: 600; font-size: 15.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
                -webkit-box-orient: vertical; overflow: hidden; }
    .tz-abgesagt .tz-titel { color: var(--text-schwach); text-decoration: line-through; }
    .tz-meta { margin-top: 3px; font-size: 13px; line-height: 1.4; color: var(--text-hell); }
    .tz-meta b { color: var(--mp); }
    .tz-kat { font-size: 13px; font-weight: 600; color: var(--text-stark); }
    .tz-abg { font-size: 13px; font-weight: 700; color: var(--fehler-text); }
    .tz .teilen { grid-column: 3; grid-row: 1; display: grid; place-items: center; width: 34px; height: 30px; margin-top: 8px;
                  color: var(--text-schwach); cursor: pointer; }
    .tz .teilen svg { width: 19px; height: 19px; }
    .tz .herz { grid-column: 3; grid-row: 2; justify-self: center; font-size: 22px; line-height: 1; padding: 2px 4px; }
    .tz-anm { grid-column: 3; grid-row: 3; align-self: start; display: grid; place-items: center; width: 34px; height: 32px;
              margin-top: 2px; color: #2563eb; cursor: pointer; }
    .tz-anm svg { width: 22px; height: 22px; }
</style>
<script>
    document.querySelectorAll(".tz-anm[data-href]").forEach(function (k) {
        function los(e) { e.preventDefault(); e.stopPropagation(); window.location.href = k.dataset.href; }
        k.addEventListener("click", los);
        k.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") los(e); });
    });
</script>
