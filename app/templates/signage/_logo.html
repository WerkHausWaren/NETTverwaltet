{#- Logo als Absender; ohne Logo der Vereinsname. hoehe = CSS-Höhe des Logos. -#}
{% if m.hat_logo %}<div style="height:{{ hoehe }}"{% if m.f.logo_kachel %} class="logo-kachel"{% endif %}><img class="logo" src="{{ url_for('signage.logo') }}" alt="{{ m.name }}"></div>
{% elif m.name %}<div style="font-size:calc({{ hoehe }} * .42);font-weight:700;line-height:{{ hoehe }}">{{ m.name }}</div>{% endif %}
