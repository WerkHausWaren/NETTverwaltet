{% extends "base.html" %}
{% block title %}Kalenderquelle bearbeiten{% endblock %}
{% block content %}
<div class="page-header">
    <div><h1>Kalenderquelle bearbeiten</h1><div class="sub">{{ q.name }}</div></div>
    <a href="{{ url_for('kalender.quellen') }}" class="btn btn-sekundaer">← Zurück</a>
</div>

<div class="karte">
    <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="feld-reihe">
            <div class="feld"><label>Name</label><input type="text" name="name" value="{{ q.name }}" required></div>
            <div class="feld"><label>Art</label>
                <select name="typ">
                    <option value="ics" {{ 'selected' if q.typ=='ics' }}>ICS-Abo (automatische Termine)</option>
                    <option value="weblink" {{ 'selected' if q.typ=='weblink' }}>Weblink (Webseite öffnen)</option>
                </select>
            </div>
        </div>
        <div class="feld"><label>Adresse / Link</label><input type="text" name="url" value="{{ q.url }}" required></div>
        <div class="aktionen">
            <button type="submit" class="btn">💾 Speichern</button>
            <a href="{{ url_for('kalender.quellen') }}" class="btn btn-sekundaer">Abbrechen</a>
        </div>
    </form>
</div>
{% endblock %}
