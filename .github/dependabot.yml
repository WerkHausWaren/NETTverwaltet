# Bibliotheken und GitHub-Aktionen automatisch auf Sicherheits- und Versions-Updates prüfen (einmal pro Woche)
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["Abhängigkeiten"]
    commit-message:
      prefix: "Abhängigkeiten"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["Abhängigkeiten"]
    commit-message:
      prefix: "Aktionen"
