# Bibliotheken und GitHub-Aktionen automatisch auf Sicherheits- und Versions-Updates prüfen (einmal pro Woche)
version: 2
updates:
  # Python-Bibliotheken: nur Sicherheits-Updates als Vorschlag. requirements.txt nennt Mindestversionen (>=),
  # installiert wird ohnehin die neueste Fassung – reine Versionssprünge wären nur Rauschen.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels: ["Abhängigkeiten"]
    commit-message:
      prefix: "Abhängigkeiten"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["Abhängigkeiten"]
    commit-message:
      prefix: "Aktionen"
