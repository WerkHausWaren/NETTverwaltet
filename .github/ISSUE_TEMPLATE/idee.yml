name: Idee vorschlagen
description: Eine neue Funktion oder Verbesserung für die Vereinsarbeit.
labels: ["Idee"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem habt ihr im Verein?
      description: Erzähl aus dem Vereinsalltag – z. B. „Wir verlieren den Überblick, wer welchen Schlüssel hat.“
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Wie könnte die Software helfen?
  - type: input
    id: verein
    attributes:
      label: Was für ein Verein seid ihr? (optional)
      placeholder: z. B. Sportverein mit 200 Mitgliedern
